# npm OIDC trusted publishing：不使用长期 NPM_TOKEN。
# 前置条件见 packages/vitepress-skill-directory/README.md 的「发布」一节。
name: Publish vitepress-skill-directory

on:
  workflow_dispatch:
  push:
    tags:
      - 'skill-directory-v*'

permissions: {}

concurrency:
  group: publish-skill-directory
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm OIDC 必需
    steps:
      - uses: actions/checkout@v6

      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('packages/vitepress-skill-directory/package.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `skill-directory-v${version}`)
            throw new Error(`Release tag must match package version ${version}`)
          NODE

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm vitest run

      - run: pnpm docs:build

      # trusted publishing 需要 npm CLI >= 11.5.1；Node 24 自带版本可能不够，显式升级
      - run: npm install -g npm@11 --registry=https://registry.npmjs.org

      # OIDC 可信发布自动附带 provenance，无需 --provenance 或 token
      - run: npm publish --registry=https://registry.npmjs.org
        working-directory: packages/vitepress-skill-directory
