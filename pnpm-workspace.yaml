catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAgeExcludePrune: true
# eslint-disable-next-line pnpm/yaml-enforce-settings
trustPolicy: off
shellEmulator: true

packages:
  - packages/*
  - plugins/*
  - docs

overrides:
  vite@>=7.0.0 <8.0.0: 7.3.6

  # VitePress 1 still requests EOL Vite 5, whose Windows dev server has no patched release.
  # Keep the security compatibility override scoped until VitePress 2 is stable.
  vitepress@1.6.4>vite: 6.4.3

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@types/node': ^26.6.5
  '@unocss/eslint-plugin': ^66.11.0
  eslint: ^10.12.0
  eslint-plugin-format: ^2.0.1
  mermaid: ^11.17.2
  typescript: ^5.9.3
  unocss: ^66.11.0
  unplugin-vue-components: ^32.1.0
  vitepress: ^1.6.4
  vitepress-plugin-mermaid: ^2.0.17
  vitepress-theme-yunlefun: ^0.4.2
  vitest: ^5.0.5
  vue: ^3.5.44
  yaml: 2.9.1
